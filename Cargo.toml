[package]
name = "dirstat"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0.12"

[[bin]]
name = "dirstat"
path = "src/main.rs"
test = false

[dev-dependencies]
tempfile = "3.27.0"
